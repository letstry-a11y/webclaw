services:
  webclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WEBCLAW_IMAGE:-webclaw:latest}
    container_name: webclaw
    restart: unless-stopped
    ports:
      - "${WEBCLAW_BIND_ADDRESS:-127.0.0.1}:${WEBCLAW_PORT:-3100}:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      INITIAL_USER_PASSWORD: "${INITIAL_USER_PASSWORD:?INITIAL_USER_PASSWORD must be set}"
      COMPANY_EMAIL_DOMAINS: "${COMPANY_EMAIL_DOMAINS:-microport.com}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (use a long random string)}"
      MANAGEMENT_REPORT_TOKEN: "${MANAGEMENT_REPORT_TOKEN:-}"
      SEED_ON_STARTUP: "${SEED_ON_STARTUP:-false}"
      TZ: "Asia/Shanghai"
    volumes:
      - webclaw-data:/app/data
      - webclaw-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  analytics-reporter:
    image: ${WEBCLAW_IMAGE:-webclaw:latest}
    container_name: webclaw-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      ANALYTICS_REPORT_DIR: "/app/访问记录"
      TZ: "Asia/Shanghai"
    volumes:
      - webclaw-data:/app/data
      - ./访问记录:/app/访问记录
    depends_on:
      webclaw:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["node", "scripts/weekly-analytics-scheduler.cjs"]

volumes:
  webclaw-data:
  webclaw-uploads:
