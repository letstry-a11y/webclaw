services:
  webclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: webclaw:latest
    container_name: webclaw
    restart: unless-stopped
    ports:
      - "${WEBCLAW_PORT:-3100}:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (use a long random string)}"
      SEED_ON_STARTUP: "${SEED_ON_STARTUP:-false}"
      TZ: "Asia/Shanghai"
    volumes:
      - webclaw-data:/app/data
      - webclaw-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  analytics-reporter:
    image: webclaw:latest
    container_name: webclaw-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      ANALYTICS_REPORT_DIR: "/app/访问记录"
      TZ: "Asia/Shanghai"
    volumes:
      - webclaw-data:/app/data
      - ./访问记录:/app/访问记录
    depends_on:
      webclaw:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["node", "scripts/weekly-analytics-scheduler.cjs"]

volumes:
  webclaw-data:
  webclaw-uploads:
