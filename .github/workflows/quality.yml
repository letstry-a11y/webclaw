name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma
        run: |
          npx prisma generate
          touch prisma/ci.db
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "file:$PWD/prisma/ci.db" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Test projects, weekly reporting and visit statistics
        run: |
          npm run test:projects
          npm run test:analytics

      - name: Production build
        run: npm run build
